# Zeiger over HTTP. Put a checkpoint in ./models/zeiger-0.6b (see README > Checkpoints), then:
#   docker compose up zeiger                      # CPU, portable
#   docker compose --profile rocm up zeiger-rocm  # AMD GPU
services:
  zeiger:
    build:
      context: .
      args:
        TORCH_INDEX: https://download.pytorch.org/whl/cpu
    image: zeiger:cpu
    ports: ["8173:8173"]
    volumes:
      - ./models:/models:ro
      - zeiger-cache:/cache            # the tokenizer is read from the checkpoint; this is only a fallback
    environment:
      ZEIGER_DEVICE: cpu
    restart: unless-stopped

  zeiger-rocm:
    profiles: ["rocm"]
    build:
      context: .
      args:
        TORCH_INDEX: https://download.pytorch.org/whl/rocm7.0
    image: zeiger:rocm
    ports: ["8173:8173"]
    # The GPU is passed through, and the HOST's ROCm runtime is mounted: the rocm7.0 wheel ships an HSA runtime
    # that segfaults on gfx1151, so LD_PRELOAD points at the host's newer one. Adjust the path to your install.
    devices: ["/dev/kfd", "/dev/dri"]
    group_add: ["video", "render"]
    security_opt: ["seccomp:unconfined"]
    ipc: host
    volumes:
      - ./models:/models:ro
      - /opt/rocm-7.2.3:/opt/rocm-7.2.3:ro
      - zeiger-cache:/cache
    environment:
      ZEIGER_DEVICE: cuda                         # ROCm presents itself to torch as "cuda"
      LD_PRELOAD: /opt/rocm-7.2.3/lib/libhsa-runtime64.so.1
      TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL: "1"
      HSA_OVERRIDE_GFX_VERSION: ""                # set e.g. 11.0.0 only if your card needs it
    restart: unless-stopped

volumes:
  zeiger-cache:
